<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아미쿠스 한국학교 체크인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --cream:#FFF6EA; --paper:#FFFFFF;
    --ink:#43352A; --ink2:#7A6A5C; --ink3:#B3A395;
    --line:#F0E2D2; --line-soft:#F7EDE0;
    --orange:#FF8A3D; --orange-deep:#F26B1D; --orange-bg:#FFEFE0;
    --yellow:#FFD466;
    --green:#3FA765; --green-bg:#E6F6EC;
    --amber:#C98A0C; --amber-bg:#FFF3D6;
    --blue:#5BA8E5;
    --stamp:#E8543F;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--cream); color:var(--ink);
    display:flex; flex-direction:column; user-select:none;
  }
  .jua{font-family:"Jua","Pretendard Variable",sans-serif;font-weight:400}
  /* ---------- header ---------- */
  header{
    padding:16px 24px 10px; display:flex; align-items:center; gap:14px;
  }
  .logo{
    width:48px;height:48px;border-radius:15px;background:var(--orange);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:"Jua";font-size:24px;flex:none;
    transform:rotate(-6deg);
    box-shadow:0 4px 0 rgba(242,107,29,.25);
  }
  .htitle{flex:1;min-width:0}
  .htitle h1{font-family:"Jua";font-size:21px;font-weight:400;letter-spacing:-.2px}
  .htitle p{font-size:12.5px;color:var(--ink3);margin-top:1px}
  .kclock{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:12px}
  .kclock .kd{font-size:14px;color:var(--ink2);font-weight:600}
  .kclock .kt{font-family:"Jua";font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hbtn{
    border:none;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink2);
    padding:10px 15px;border-radius:99px;cursor:pointer;font-family:inherit;
    border:1.5px solid var(--line);
  }
  .hbtn.active{background:var(--orange);border-color:var(--orange);color:#fff}
  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 20px 16px;overflow:hidden;position:relative}
  .deco{position:absolute;font-family:"Jua";color:#F2E3CE;z-index:0;pointer-events:none}
  .deco.d1{font-size:120px;left:-14px;bottom:-30px;transform:rotate(-12deg)}
  .deco.d2{font-size:90px;right:6px;top:10px;transform:rotate(10deg)}
  .deco.d3{font-size:70px;right:60px;bottom:40px;transform:rotate(-7deg);color:#F5E9DA}
  .stage{width:100%;max-width:700px;display:flex;flex-direction:column;flex:1;min-height:0;position:relative;z-index:1}
  /* 검색 전(대기 화면)에는 문구·시계·검색창을 페이지 세로 중앙에 배치 */
  #viewKiosk::before{content:"";flex:0 1 0;transition:flex .25s ease}
  #viewKiosk.idle::before{flex:1 1 0}
  .prompt{font-family:"Jua";font-size:31px;text-align:center;line-height:1.4;max-width:640px;margin:0 auto}
  .prompt small{display:block;font-family:"Pretendard Variable",sans-serif;font-size:15.5px;color:var(--ink2);font-weight:600;margin-top:8px}
  .searchbox{margin-top:16px;position:relative}
  .searchbox input{
    width:100%;height:66px;border:2.5px solid var(--line);border-radius:24px;
    background:var(--paper);font-size:22px;padding:0 60px 0 24px;outline:none;
    font-family:inherit;color:var(--ink);
    box-shadow:0 3px 0 rgba(210,180,140,.12);
  }
  .searchbox input::placeholder{color:#CBBBA8}
  .searchbox input:focus{border-color:var(--orange)}
  .searchbox .sicon{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:22px}
  #clearBtn{position:absolute;right:15px;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;border:none;background:var(--line-soft);
    color:var(--ink2);font-size:16px;cursor:pointer;display:none}
  .scroll{margin-top:14px;overflow-y:auto;flex:1;min-height:0;padding:2px 2px 10px}
  .hintbox{text-align:center;color:var(--ink3);font-size:15px;padding:34px 10px;line-height:1.8}
  .kbadge{display:inline-block;background:var(--orange-bg);color:var(--orange-deep);border-radius:10px;padding:2px 10px;font-weight:700}
  /* ---------- student card = 이름표 ---------- */
  .scard{
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:15px 18px;display:flex;align-items:center;gap:15px;margin-bottom:10px;
    cursor:pointer;transition:transform .08s, border-color .12s;
    animation:rise .22s ease-out both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .scard:active{transform:scale(.985);border-color:var(--orange)}
  .avatar{
    width:54px;height:54px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:"Jua";font-size:24px;
  }
  .sinfo{flex:1;min-width:0}
  .sname{font-family:"Jua";font-size:21px;letter-spacing:-.2px}
  .smeta{margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{font-size:13px;padding:3.5px 11px;border-radius:99px;font-weight:700}
  .chip.gender{background:var(--line-soft);color:var(--ink2)}
  .badge{font-size:14px;font-weight:800;padding:7px 13px;border-radius:99px;flex:none}
  .badge.in{background:var(--green-bg);color:var(--green)}
  .badge.out{background:var(--amber-bg);color:var(--amber)}
  .badge.pick{background:var(--orange-bg);color:var(--orange-deep)}
  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(67,53,42,.42);display:none;
    align-items:center;justify-content:center;padding:22px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--paper);border-radius:28px;max-width:470px;width:100%;
    padding:30px 26px 24px;text-align:center;animation:pop .2s ease-out;
    max-height:88vh;overflow-y:auto}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .avatar{width:76px;height:76px;font-size:33px;margin:0 auto}
  .modal h2{font-family:"Jua";font-size:28px;font-weight:400;margin-top:13px}
  .modal .mmeta{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .modal .mmeta .chip{font-size:14.5px;padding:6px 14px}
  .modal .q{margin-top:17px;font-size:16px;color:var(--ink2)}
  .mbtns{display:flex;gap:10px;margin-top:22px}
  .btn{flex:1;height:60px;border-radius:18px;border:none;font-size:18px;font-weight:800;
    cursor:pointer;font-family:inherit;letter-spacing:-.3px}
  .btn.ghost{background:var(--line-soft);color:var(--ink2)}
  .btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 rgba(242,107,29,.3)}
  .btn.primary:active{background:var(--orange-deep);box-shadow:none;transform:translateY(2px)}
  .btn.warn{background:var(--amber-bg);color:var(--amber)}
  .btn.sm{height:48px;font-size:15.5px;border-radius:14px}
  /* ---------- 도장 (stamp) done screen ---------- */
  .stampwrap{position:relative;width:200px;height:200px;margin:10px auto 4px}
  .stamp{
    position:absolute;inset:0;border-radius:50%;
    border:4px solid currentColor;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transform:rotate(-8deg);
    animation:stampin .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .stamp::before{
    content:"";position:absolute;inset:7px;border-radius:50%;
    border:1.5px solid currentColor;opacity:.7;
  }
  .stamp.in{color:var(--stamp)}
  .stamp.out{color:var(--blue)}
  .stamp .big{font-family:"Jua";font-size:38px;line-height:1.1}
  .stamp .small{font-family:"Jua";font-size:16px;opacity:.85}
  @keyframes stampin{
    0%{transform:scale(2.1) rotate(-24deg);opacity:0}
    55%{transform:scale(.94) rotate(-7deg);opacity:1}
    100%{transform:scale(1) rotate(-8deg)}
  }
  .done h2{margin-top:10px}
  .done .sub{margin-top:7px;color:var(--ink2);font-size:15.5px;line-height:1.6}
  @media (prefers-reduced-motion: reduce){
    .stamp,.scard,.modal{animation:none}
  }
  /* ---------- banner ---------- */
  #banner{display:none;background:var(--yellow);color:#6B5200;font-size:13px;
    padding:8px 16px;text-align:center;font-weight:600}
  /* ---------- teacher ---------- */
  .clsbar{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;flex:none}
  .clschip{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:99px;
    padding:10px 16px;font-family:"Jua";font-size:15px;color:var(--ink2);cursor:pointer}
  .trow{
    background:var(--paper);border:2px solid var(--line);border-radius:18px;
    padding:12px 15px;display:flex;align-items:center;gap:12px;margin-bottom:9px;
  }
  .trow .avatar{width:44px;height:44px;font-size:19px}
  .trow .sname{font-size:18px}
  .tstate{display:flex;gap:6px;flex:none}
  .tbtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;
    padding:9px 12px;font-size:13.5px;font-weight:800;color:var(--ink3);cursor:pointer;font-family:inherit}
  .tbtn.in.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .tbtn.out.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
  .tbtn.none.on{background:var(--line-soft);border-color:var(--ink3);color:var(--ink2)}
  .summary{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;flex:none}
  .stat{flex:1;min-width:100px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:13px 15px}
  .stat b{display:block;font-family:"Jua";font-size:26px;font-weight:400}
  .stat span{font-size:12.5px;color:var(--ink3);font-weight:600}
  /* ---------- admin ---------- */
  table.adm{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);
    border:2px solid var(--line);border-radius:18px;overflow:hidden;font-size:14.5px}
  table.adm th{background:var(--line-soft);text-align:left;padding:11px 13px;font-size:12.5px;color:var(--ink2)}
  table.adm td{padding:11px 13px;border-top:1.5px solid var(--line-soft)}
  table.adm td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .pinpad input{width:100%;height:58px;text-align:center;font-size:26px;letter-spacing:8px;
    border:2.5px solid var(--line);border-radius:16px;outline:none;margin-top:16px;font-family:inherit}
  .pinpad input:focus{border-color:var(--orange)}
  footer{text-align:center;font-size:11.5px;color:var(--ink3);padding:9px}
</style>
</head>
<body>

<div id="banner">⚠️ 오프라인 모드 — 기록이 이 기기에만 저장됩니다</div>

<header>
  <a href="index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;flex:1">
    <div class="logo">한</div>
    <div class="htitle">
      <h1 id="schoolName">아미쿠스 한국학교</h1>
      <p id="modeLabel">어서 오세요! · Check-in</p>
    </div>
  </a>
  <a class="hbtn" href="teacher.html" style="text-decoration:none">선생님 포털</a>
</header>

<main>
  <span class="deco d1">ㅎ</span>
  <span class="deco d2">ㅏ</span>
  <span class="deco d3">ㄴ</span>

  <!-- ============ 학부모 키오스크 ============ -->
  <div class="stage idle" id="viewKiosk">
    <div class="prompt">오늘도 아미쿠스 한국학교에 오신 것을 환영합니다! 💛<small>아래에서 아이의 이름을 검색하여 체크인/체크아웃을 진행해주세요.</small></div>
    <div class="kclock"><span class="kd" id="dateNow"></span><span class="kt" id="timeNow">--:--</span></div>
    <div class="searchbox">
      <input id="q" type="text" placeholder="예: 홍길동 또는 ㅎㄱㄷ" autocomplete="off">
      <span class="sicon" id="sicon">🔍</span>
      <button id="clearBtn">✕</button>
    </div>
    <div class="scroll" id="results"><div class="hintbox">이름을 입력하면 학생이 여기에 나타나요</div></div>
  </div>

  <!-- ============ 선생님 ============ -->
  <div class="stage" id="viewTeacher" style="display:none">
    <div class="clsbar" id="clsBar"></div>
    <div class="summary" id="tSummary"></div>
    <div class="scroll" id="tList"></div>
  </div>

  <!-- ============ 관리자 ============ -->
  <div class="stage" id="viewAdmin" style="display:none">
    <div class="summary" id="aSummary"></div>
    <div class="scroll" id="aBody" style="margin-top:14px"></div>
    <div class="mbtns" style="flex:none">
      <button class="btn sm ghost" id="csvBtn">오늘 기록 CSV 저장</button>
      <button class="btn sm primary" id="refreshBtn">새로고침</button>
    </div>
  </div>
</main>

<footer id="footNote">아미쿠스 한국학교 체크인 · <a href="teacher.html" style="color:var(--ink3)">선생님 포털</a></footer>

<div class="overlay" id="confirmOv"><div class="modal" id="confirmModal"></div></div>
<div class="overlay" id="doneOv"><div class="modal done" id="doneModal"></div></div>
<div class="overlay" id="pinOv"><div class="modal" id="pinModal"></div></div>

<script>
/* =====================================================================
   CONFIG — API_URL: Google Apps Script 웹앱 URL (비우면 오프라인 모드)
   ===================================================================== */
const CONFIG = {
  SCHOOL_NAME: "아미쿠스 한국학교",
  API_URL: "https://script.google.com/macros/s/AKfycbziGOuwT-o0_IIGCxRvMVN069lWvTzjElM-4Le2s95HRA1N2rj-I5qB71XwZ6iTu9gH/exec",
  TEACHER_PIN: "1111",
  ADMIN_PIN: "2026",
  SYNC_SEC: 30,
};

const ROSTER_DATA = []; // 명단은 백엔드(구글시트)에서 불러옵니다

let ROSTER = ROSTER_DATA.map(r => ({name:r[0], gender:r[1], cls:r[2], id:r[0]+"|"+r[2]}));
let LOG = [];
let MODE = "kiosk";
const $ = id => document.getElementById(id);
const getClasses = () => [...new Set(ROSTER.map(s=>s.cls))];

/* ---------- 반별 색상 ---------- */
const CLS_COLORS = {
  "가람": ["#E3F0FE","#2E6FBB"], "누리": ["#EFE7FD","#6C4FC4"],
  "다솜": ["#FDE7EF","#D14D84"], "마루": ["#E4F6F9","#1F8CA8"],
  "슬기": ["#E8F6E3","#3E9142"], "아름": ["#FFF3D6","#C98A0C"],
  "자비": ["#E2F5F0","#1F9077"], "파도": ["#E3ECFB","#3757B8"],
  "하늘": ["#E0F2FF","#2B8FD8"],
};
function clsColor(cls){
  const base = Object.keys(CLS_COLORS).find(k => (cls||"").startsWith(k));
  return base ? CLS_COLORS[base] : ["#F3EBE0","#8A6D4F"];
}
const avatarHtml = (s, extra="") =>
  `<div class="avatar" style="background:${clsColor(s.cls)[0]};color:${clsColor(s.cls)[1]};${extra}">${s.name.replace(/\s/g,"")[0]||"?"}</div>`;
const clsChip = s =>
  `<span class="chip" style="background:${clsColor(s.cls)[0]};color:${clsColor(s.cls)[1]}">${s.cls}</span>`;

/* ---------- 초성 검색 ---------- */
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const choseong = s => [...s].map(ch => {
  const c = ch.charCodeAt(0);
  return (c>=0xAC00&&c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch;
}).join("");
const isChoOnly = s => [...s].every(ch => CHO.includes(ch)||ch===" ");

/* ---------- 시계 ---------- */
function tick(){
  const n=new Date(), days=["일","월","화","수","목","금","토"];
  $("dateNow").textContent=`${n.getFullYear()}. ${n.getMonth()+1}. ${n.getDate()} (${days[n.getDay()]})`;
  $("timeNow").textContent=n.toTimeString().slice(0,5);
}
setInterval(tick,1000); tick();

/* ---------- 수업일 기준 (선생님 포털과 동일) ----------
   🗓️ 가을학기 2026-08-14부터 15주, 금요일 수업.
   체크인 기록을 '그 주 수업일(금)'로 귀속시켜 선생님 포털과 항상 같은 날짜를 보게 합니다. */
const FRIDAYS = (()=>{ const out=[]; const d=new Date(2026,7,14);
  for(let i=0;i<15;i++){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`); d.setDate(d.getDate()+7); }
  return out; })();
function classDate(){
  const now = new Date(), dow = now.getDay(); // 0=일 ... 6=토
  const t = new Date(now);
  if(dow===4) t.setDate(now.getDate()+1);        // 목 → 내일(금)
  else if(dow===6) t.setDate(now.getDate()-1);   // 토 → 어제(금)
  else if(dow!==5) t.setDate(now.getDate()-((dow+2)%7)); // 일~수 → 지난 금요일
  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  if(iso<=FRIDAYS[0]) return FRIDAYS[0];
  for(const f of FRIDAYS){ if(f===iso) return f; }
  for(const f of FRIDAYS){ if(f>=iso) return f; }
  return FRIDAYS[FRIDAYS.length-1];
}

/* ---------- 로컬 백업 ---------- */
function saveLocal(){ try{ localStorage.setItem("kc_log", JSON.stringify(LOG)); }catch(e){} }
function loadLocal(){
  try{
    const all=JSON.parse(localStorage.getItem("kc_log")||"[]");
    const today=new Date().toDateString();
    LOG=all.filter(r=>new Date(r.ts).toDateString()===today);
  }catch(e){}
}

/* ---------- 서버 통신 ---------- */
async function api(params){
  if(!CONFIG.API_URL) return null;
  const u = CONFIG.API_URL + "?" + new URLSearchParams(params);
  const r = await fetch(u); return r.json();
}
async function post(body){
  if(!CONFIG.API_URL) return null;
  return fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
}
async function syncFromServer(){
  if(!CONFIG.API_URL) return;
  try{
    const r = await api({action:"roster"});
    if(r && r.ok && r.roster && r.roster.length){
      ROSTER = r.roster.map(s=>({...s, id:s.name+"|"+s.cls}));
      $("banner").style.display="none";
    }
  }catch(e){ console.warn("roster", e); }
  try{
    const d = await api({action:"today", date: classDate()});
    if(d && d.ok){ LOG = d.log || []; saveLocal(); }
  }catch(e){ console.warn("today", e); }
}

/* ---------- 상태 ---------- */
function stateOf(id){
  let last=null;
  for(const r of LOG) if(r.id===id) last=r;
  return last ? last.type : "none";
}

/* ============================================================
   학부모 키오스크
   ============================================================ */
function search(qraw){
  const q=qraw.trim(), box=$("results");
  $("viewKiosk").classList.toggle("idle", !q);
  $("clearBtn").style.display=q?"block":"none";
  $("sicon").style.display=q?"none":"block";
  if(!q){ box.innerHTML=`<div class="hintbox">이름을 입력하면 학생이 여기에 나타나요</div>`; return; }
  const qn=q.replace(/\s/g,"");
  const matches = ROSTER.filter(s=>{
    const nm=s.name.replace(/\s/g,"");
    return isChoOnly(qn) ? choseong(nm).includes(qn) : nm.includes(qn);
  });
  if(!matches.length){
    box.innerHTML=`<div class="hintbox">검색 결과가 없어요.<br>예) <span class="kbadge">홍길동</span> <span class="kbadge">ㅎㄱㄷ</span></div>`;
    return;
  }
  box.innerHTML=matches.slice(0,30).map((s,i)=>{
    const st=stateOf(s.id);
    const badge = st==="in" ? `<span class="badge in">✓ 등원</span>`
                : st==="out" ? `<span class="badge out">👋 하원</span>`
                : `<span class="badge pick">선택 ›</span>`;
    return `<div class="scard" style="animation-delay:${Math.min(i*40,240)}ms" onclick="openConfirm('${s.id.replace(/'/g,"\\'")}')">
      ${avatarHtml(s)}
      <div class="sinfo">
        <div class="sname">${s.name}</div>
        <div class="smeta"><span class="chip gender">${s.gender}</span>${clsChip(s)}</div>
      </div>${badge}</div>`;
  }).join("");
}
$("q").addEventListener("input",e=>search(e.target.value));
$("clearBtn").onclick=()=>{ $("q").value=""; search(""); $("q").focus(); };

let current=null;
function openConfirm(id){
  const s=ROSTER.find(x=>x.id===id); if(!s) return;
  current=s;
  const st=stateOf(id), isIn=st==="in";
  $("confirmModal").innerHTML=`
    ${avatarHtml(s)}
    <h2>${s.name}</h2>
    <div class="mmeta"><span class="chip gender">${s.gender}</span>${clsChip(s)}</div>
    <div class="q">${isIn?"오늘 이미 등원 도장을 받았어요.":"우리 아이가 맞나요?"}</div>
    <div class="mbtns">
      <button class="btn ghost" onclick="closeOv('confirmOv')">아니에요</button>
      ${isIn?`<button class="btn warn" onclick="record('out','kiosk')">하원 체크아웃</button>`
            :`<button class="btn primary" onclick="record('in','kiosk')">등원 체크인</button>`}
    </div>`;
  $("confirmOv").classList.add("show");
}
function closeOv(id){ $(id).classList.remove("show"); }

async function record(type,by,student){
  const s=student||current; if(!s) return;
  const rec={id:s.id,name:s.name,gender:s.gender,cls:s.cls,type,ts:new Date().toISOString(),by};
  LOG.push(rec); saveLocal();
  closeOv("confirmOv");
  if(by==="kiosk") showDone(rec);
  post({action:"record",...rec, date: classDate()}).catch(e=>console.warn(e));
  if(MODE==="teacher") renderTeacher();
  if(MODE==="admin") renderAdmin();
}
function showDone(rec){
  const inn=rec.type==="in", t=new Date(rec.ts);
  const hhmm = `${t.getHours()}시 ${String(t.getMinutes()).padStart(2,"0")}분`;
  $("doneModal").innerHTML=`
    <div class="stampwrap">
      <div class="stamp ${rec.type}">
        <div class="big">${inn?"참 잘했어요!":"안녕히 가세요!"}</div>
        <div class="small">${inn?"등원 완료":"하원 완료"} · ${hhmm}</div>
      </div>
    </div>
    <h2>${rec.name}</h2>
    <div class="sub">${rec.cls}<br>${inn?"오늘도 즐거운 한국학교! 😊":"다음 주에 또 만나요! 👋"}</div>
    <div class="mbtns"><button class="btn primary" onclick="finishDone()">확인</button></div>`;
  $("doneOv").classList.add("show");
  clearTimeout(window._dt); window._dt=setTimeout(finishDone,3500);
}
function finishDone(){ closeOv("doneOv"); $("q").value=""; search(""); $("q").blur(); }

/* ============================================================
   모드 전환 + PIN
   ============================================================ */
function askPin(target){
  $("pinModal").innerHTML=`
    <h2 style="font-size:22px">${target==="teacher"?"선생님":"관리자"} 확인</h2>
    <div class="pinpad"><input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"></div>
    <div class="mbtns">
      <button class="btn sm ghost" onclick="closeOv('pinOv')">취소</button>
      <button class="btn sm primary" onclick="checkPin('${target}')">확인</button>
    </div>`;
  $("pinOv").classList.add("show");
  setTimeout(()=>{ const i=$("pinInput"); i.focus(); i.onkeydown=e=>{ if(e.key==="Enter") checkPin(target); }; },80);
}
function checkPin(target){
  const v=$("pinInput").value;
  const ok = target==="teacher" ? v===CONFIG.TEACHER_PIN : v===CONFIG.ADMIN_PIN;
  if(!ok){ $("pinInput").value=""; $("pinInput").placeholder="PIN이 틀렸어요"; return; }
  closeOv("pinOv"); setMode(target);
}
function setMode(m){
  MODE=m;
  $("viewKiosk").style.display = m==="kiosk"?"flex":"none";
  $("viewTeacher").style.display = m==="teacher"?"flex":"none";
  $("viewAdmin").style.display = m==="admin"?"flex":"none";
  $("teacherBtn").classList.toggle("active",m==="teacher");
  $("adminBtn").classList.toggle("active",m==="admin");
  $("modeLabel").textContent = m==="kiosk"?"어서 오세요! · Check-in":(m==="teacher"?"선생님 · 반별 출석":"관리자 · 전체 현황");
  if(m==="teacher"){ syncFromServer().then(renderTeacher); renderTeacher(); }
  if(m==="admin"){ syncFromServer().then(renderAdmin); renderAdmin(); }
}
/* 선생님/관리자 기능은 teacher.html 포털로 이동했습니다 */

/* ============================================================
   선생님 — 반별 출석표
   ============================================================ */
let curCls = null;
function renderTeacher(){
  const CLASSES=getClasses();
  if(!curCls||!CLASSES.includes(curCls)) curCls=CLASSES[0];
  $("clsBar").innerHTML=CLASSES.map(c=>{
    const [bg,fg]=clsColor(c);
    const on=c===curCls;
    return `<button class="clschip" style="${on?`background:${fg};border-color:${fg};color:#fff`:`color:${fg};border-color:${bg};background:${bg}`}" onclick="curCls='${c.replace(/'/g,"\\'")}';renderTeacher()">${c}</button>`;
  }).join("");
  const kids=ROSTER.filter(s=>s.cls===curCls);
  const nIn=kids.filter(s=>stateOf(s.id)==="in").length;
  const nOut=kids.filter(s=>stateOf(s.id)==="out").length;
  $("tSummary").innerHTML=`
    <div class="stat"><b style="color:var(--green)">${nIn}</b><span>등원 중</span></div>
    <div class="stat"><b style="color:var(--amber)">${nOut}</b><span>하원</span></div>
    <div class="stat"><b>${kids.length-nIn-nOut}</b><span>미등원</span></div>
    <div class="stat"><b>${kids.length}</b><span>전체</span></div>`;
  $("tList").innerHTML=kids.map(s=>{
    const st=stateOf(s.id);
    return `<div class="trow">
      ${avatarHtml(s)}
      <div class="sinfo"><div class="sname jua">${s.name}</div></div>
      <div class="tstate">
        <button class="tbtn none ${st==="none"?"on":""}" onclick="tSet('${s.id.replace(/'/g,"\\'")}','none')">미등원</button>
        <button class="tbtn in ${st==="in"?"on":""}" onclick="tSet('${s.id.replace(/'/g,"\\'")}','in')">등원</button>
        <button class="tbtn out ${st==="out"?"on":""}" onclick="tSet('${s.id.replace(/'/g,"\\'")}','out')">하원</button>
      </div></div>`;
  }).join("");
}
function tSet(id,type){
  const s=ROSTER.find(x=>x.id===id); if(!s) return;
  if(stateOf(id)===type) return;
  record(type,"teacher",s);
}

/* ============================================================
   관리자 — 전체 현황
   ============================================================ */
function renderAdmin(){
  const nIn=ROSTER.filter(s=>stateOf(s.id)==="in").length;
  const nOut=ROSTER.filter(s=>stateOf(s.id)==="out").length;
  $("aSummary").innerHTML=`
    <div class="stat"><b style="color:var(--green)">${nIn}</b><span>등원 중</span></div>
    <div class="stat"><b style="color:var(--amber)">${nOut}</b><span>하원</span></div>
    <div class="stat"><b>${ROSTER.length-nIn-nOut}</b><span>미등원</span></div>
    <div class="stat"><b>${ROSTER.length}</b><span>전체 학생</span></div>`;
  const rows=getClasses().map(c=>{
    const [bg,fg]=clsColor(c);
    const kids=ROSTER.filter(s=>s.cls===c);
    const cin=kids.filter(s=>stateOf(s.id)==="in");
    const cout=kids.filter(s=>stateOf(s.id)==="out");
    const none=kids.filter(s=>stateOf(s.id)==="none");
    return `<tr>
      <td><span class="chip" style="background:${bg};color:${fg}">${c}</span></td>
      <td class="num" style="color:var(--green)">${cin.length}</td>
      <td class="num" style="color:var(--amber)">${cout.length}</td>
      <td class="num">${none.length}</td>
      <td class="num">${kids.length}</td>
      <td style="font-size:12.5px;color:var(--ink3)">${none.map(s=>s.name).join(", ")||"—"}</td>
    </tr>`;
  }).join("");
  $("aBody").innerHTML=`<table class="adm">
    <tr><th>반</th><th style="text-align:right">등원</th><th style="text-align:right">하원</th><th style="text-align:right">미등원</th><th style="text-align:right">전체</th><th>미등원 학생</th></tr>
    ${rows}</table>`;
}
$("refreshBtn").onclick=()=>syncFromServer().then(renderAdmin);
$("csvBtn").onclick=()=>{
  const head="이름,성별,등록수업,구분,시간,기록자\n";
  const body=LOG.map(r=>{
    const t=new Date(r.ts);
    return `${r.name},${r.gender},${r.cls},${r.type==="in"?"등원":r.type==="out"?"하원":"취소"},${t.toLocaleString("ko-KR")},${r.by==="teacher"?"선생님":"키오스크"}`;
  }).join("\n");
  const blob=new Blob(["\uFEFF"+head+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`체크인기록_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

/* ---------- 주기 동기화 ---------- */
setInterval(()=>{
  if(!CONFIG.API_URL) return;
  if(MODE==="teacher") syncFromServer().then(renderTeacher);
  else if(MODE==="admin") syncFromServer().then(renderAdmin);
}, CONFIG.SYNC_SEC*1000);

/* ---------- init ---------- */
$("schoolName").textContent=CONFIG.SCHOOL_NAME;
/* footer는 HTML에 고정 (선생님 포털 링크 유지) */
if(!CONFIG.API_URL) $("banner").style.display="block";
loadLocal();
(async ()=>{
  for(let i=0; i<4 && ROSTER.length===0; i++){
    await syncFromServer();
    if(ROSTER.length===0) await new Promise(r=>setTimeout(r, 1500));
  }
  search($("q").value);
})();
</script>
</body>
</html>
